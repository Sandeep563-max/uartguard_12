[pytest]
pythonpath = src
testpaths = tests
addopts = --html=reports/test_report.html --self-contained-html --cov=uart_validator --cov-report=term-missing
markers =
    smoke: Quick sanity checks
    functional: Core functionality tests
    boundary: Boundary value analysis tests
    negative: Negative test cases
    fault_injection: Fault injection tests
    regression: Regression tests
    integration: Integration tests with serial loopback
